<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiene Nombre - Connected</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px}</style></head>
<body><h1>Tiene Nombre Publisher</h1>
<p id="msg">Reading authorization...</p><code id="code"></code>
<script>
var p=new URLSearchParams(location.search);var c=p.get('code'),e=p.get('error');
document.getElementById('msg').textContent=c?'TikTok account authorized. Copy this code back into the tool:':(e?('Authorization failed: '+e):'No authorization code found.');
document.getElementById('code').textContent=c||'';
</script></body></html>
